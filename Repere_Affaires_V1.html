async function cloudInit(){

async function cloudLogin(form){

 if(!form.reportValidity())return;
 cloud.loading=true;form.querySelector('button[type="submit"]').disabled=true;cloudGateMessage('Connexion en cours…');
 try{
  await cloud.sdk.setPersistence(cloud.auth,form.elements.remember.checked?cloud.sdk.browserLocalPersistence:cloud.sdk.browserSessionPersistence);
  const result=await cloud.sdk.signInWithEmailAndPassword(cloud.auth,form.elements.email.value.trim(),form.elements.password.value);
  if(result.user.uid!==CLOUD_OWNER){await cloud.sdk.signOut(cloud.auth);cloudGateMessage('Ce compte n’est pas autorisé pour cet espace.');}
 }catch(e){cloudGateMessage(cloudError(e))}finally{cloud.loading=false;if(document.contains(form))form.querySelector('button[type="submit"]').disabled=false;form.elements.password.value=''}
}

async function cloudAction(action){
 try{
  if(action==='reload'){location.reload();return}
  if(action==='reset'){await cloudResetPassword();return}
  if(action==='account'){cloudAccount();return}
  if(cloud.locked)return;
  if(action==='retry'){const ok=await persist();if(ok){if(CLOUD_WEB)await cloudRun(true);else toast('Enregistré dans IndexedDB.')}cloudRefresh()}
  if(action==='signout')await cloudSignOut();
  if(action==='export-local')exportData();
  if(action==='export-remote'&&cloud.view.remote)cloudDownload(cloud.view.remote.data,'Firebase');
  if(action==='choose-local')cloudChoose('local');
  if(action==='choose-remote')cloudChoose('remote');
  if(action==='legacy'){
   const raw=localStorage.getItem('repere-affaires-v1');if(!raw){toast('Aucune ancienne copie sur cette adresse. Exportez un JSON depuis votre ancien fichier local, puis utilisez Importer.');return}
   closeModal();proposeRestore(JSON.parse(raw),'Anciennes données de ce navigateur · la confirmation remplacera également votre espace synchronisé.');
  }
  if(action==='saved-local'||action==='saved-remote'){
   const saved=await localState.store.get('conflict:'+action.slice(6));if(!saved){toast('Aucune copie remplacée conservée sur cet appareil.');return}cloudDownload(saved.data,'conflit_'+action.slice(6));
  }
 }catch(e){toast(cloudError(e))}
}

function initSynthesisV119(projectId=''){
 synthesisConfig=synthesisDefaults(projectId);ui.synPreviewIndex=0;
 if(!projectId){try{
  const old=JSON.parse(localStorage.getItem(STORE+'-synthesis-config')||'null');
  if(old?.version===1){
   const c=synthesisConfig;
   for(const key of ['title','author','note','companyId'])if(typeof old[key]==='string')c[key]=old[key].slice(0,key==='note'?5000:200);
   if(['weekly','affair','company','handover'].includes(old.template))c.template=old.template;
   for(const key of ['allPhases','hideDone','hideNotStarted','hideNA','coordinates','showArchived','emailPdf'])if(typeof old[key]==='boolean')c[key]=old[key];
   for(const key of Object.keys(c.blocks))if(typeof old.blocks?.[key]==='boolean')c.blocks[key]=old.blocks[key];
   for(const key of Object.keys(c.phases))if(typeof old.phases?.[key]==='boolean')c.phases[key]=old.phases[key];
   if(Array.isArray(old.projectIds))c.projectIds=[...new Set(old.projectIds.filter(id=>project(id)))];
   for(const p of db.projects){const saved=old.selection?.[p.id];if(!saved)continue;const sel=c.selection[p.id];for(const key of ['contexts','companies','contactIds'])if(Array.isArray(saved[key]))sel[key]=[...new Set(saved[key].filter(v=>typeof v==='string'))];if(typeof saved.common==='boolean')sel.common=saved.common;}
  }
 }catch{}}
}
function ensureSynthesis(){

 if(item.phase==='transverse'&&!item.contextKeys?.length)return 'Transverse · toute l’affaire';
 const all=itemContexts(item,p),selected=all.filter(k=>keys.includes(k)),outside=all.filter(k=>!keys.includes(k));

function buildSynthesis(config=ensureSynthesis()){
 const issues=[],affairs=[],external=synthesisExternal(config),b={...config.blocks};
 if(external){b.general=false;b.links=false;b.handover=false;if(!companyById(config.companyId)||isEdfEntity(companyById(config.companyId)))issues.push('Choisissez une entreprise intervenante.');}
 const effective={...config,blocks:b};
 if(!config.projectIds.length)issues.push('Sélectionnez au moins une affaire.');
 if(!Object.values(b).some(Boolean))issues.push('Sélectionnez au moins un bloc.');
 for(const id of [...new Set(config.projectIds)]){
  const p=project(id);if(!p)continue;
  const raw=config.selection[id]||synthesisSelection(p),selection={contexts:raw.contexts.filter(k=>contextKeys(p).includes(k)),companies:raw.companies.filter(id=>synthesisProviders(p).some(part=>part.companyId===id)&&(!external||id===config.companyId)),contactIds:[...new Set(raw.contactIds||[])],common:external?false:raw.common};
  if(!selection.contexts.length){issues.push(p.title+' : choisissez au moins un projet TEM / AT.');continue}
  if(!selection.companies.length&&!selection.common){issues.push(p.title+' : choisissez une entreprise ou le suivi EDF / sans entreprise.');continue}
  const scopedElements=db.elements.filter(e=>e.projectId===id&&synthesisScopeMatch(e,p,selection.contexts)&&synthesisCompanyMatch(e.companyId,p,selection));
  const phaseElements=scopedElements.filter(e=>synthesisPhaseMatch(e,p,selection,effective));
  const elements=phaseElements.filter(e=>(!config.hideDone||elementState(e).kind!=='done')&&(!config.hideNA||e.state!=='na')&&(!config.hideNotStarted||e.state!==''));
  const tasks=db.tasks.filter(t=>t.projectId===id&&synthesisScopeMatch(t,p,selection.contexts)&&synthesisTaskMatches(t,p,selection)&&(!config.hideDone||t.status!=='done')).sort(synthesisTaskSort);
  const stats=Object.entries(ELEMENT_PHASES).map(([key,label])=>({key,label,...elementStats(scopedElements.filter(e=>e.phase===key))}));
  const phaseStats=Object.keys(ELEMENT_PHASES).map(key=>({key,...elementStats(phaseElements.filter(e=>e.phase===key))}));
  affairs.push({p,selection,elements,tasks,stats,phaseStats,companies:synthesisProviders(p).filter(part=>selection.companies.includes(part.companyId)),links:external?[]:synthesisLinks(p,selection,elements),hiddenElements:phaseElements.length-elements.length});
 }

function synthesisEml(mail){

 return ['X-Unsent: 1','MIME-Version: 1.0','Date: '+new Date().toUTCString(),'Subject: '+subject.join('\r\n '),'Content-Type: multipart/alternative; boundary="'+boundary+'"','','--'+boundary,'Content-Type: text/plain; charset=UTF-8','Content-Transfer-Encoding: base64','',encoded(mail.text),'--'+boundary,'Content-Type: text/html; charset=UTF-8','Content-Transfer-Encoding: base64','',encoded('<!doctype html><html lang="fr"><head><meta charset="utf-8"><\/head><body>'+mail.html+'<\/body></html>'),'--'+boundary+'--',''].join('\r\n');
}

function renderNotes(p){let pages=db.pages.filter(q=>inScope(q,p)).map(pageView);const contactsOpen=ui.pageId===CONTACT_SHEET;if(!contactsOpen&&!pages.some(q=>q.id===ui.pageId))ui.pageId=pages[0]?.id||'';const q=contactsOpen?null:currentPage();let crumbs=[],parent=q?.parentId;while(parent){let a=pageById(parent);if(!a)break;crumbs.unshift(`<button data-act="open-page" data-id="${a.id}">${esc(a.title)}</button>`);parent=a.parentId}return `<div class="notes-layout"><aside class="notes-nav">${filterBar('notes',filterQuery('notes','Rechercher dans les pages…'))}<div class="notes-nav-head"><span class="eyebrow" style="font-size:12px">Pages de l’affaire</span><button class="icon-btn" data-act="new-page" title="Nouvelle page">${ic('plus',16)}</button></div>${`<div data-tranche="${esc(project(p.id).tranche)}" class="tree-item scope-frame contact-sheet-nav ${contactsOpen?'active':''}"><span>${ic('user',15)}</span><button class="page-link" data-act="project-contacts">Contacts de l’affaire</button><span class="badge">${contactsForProject(project(p.id)).length}</span></div>`}${pageTree(p.id)||'<p class="muted" style="padding:12px 8px;font-size:12px">Aucune page à afficher. Ajustez la recherche ou ajoutez une page.</p>'}<div style="padding:13px 8px 0;border-top:1px solid var(--line);margin-top:12px"><button class="text-button" data-act="page-template">${ic('plus',13)} Depuis un modèle</button></div></aside><section class="paper scope-frame" data-tranche="${contactsOpen?project(p.id).tranche:q?pageScope(q):p.tranche}">${contactsOpen?renderProjectContacts(p):q?`<div class="paper-tools"><button class="icon-btn format-btn" data-format="bold" title="Gras (Ctrl B)"><b>G</b></button><button class="icon-btn format-btn" data-format="italic" title="Italique (Ctrl I)"><i>I</i></button><button class="icon-btn format-btn" data-format="underline" title="Souligné (Ctrl U)"><u>S</u></button><button class="icon-btn format-btn" data-format="strikeThrough" title="Barré"><s>B</s></button><button class="icon-btn format-btn" data-format="hiliteColor" title="Surligner">▰</button><button class="icon-btn" data-act="inline-link" title="Insérer un lien">${ic('link',16)}</button><span class="tool-divider"></span><button class="btn ghost small" data-act="slash-end" title="Insérer un bloc">${ic('plus',14)}Bloc <kbd class="kbd">/</kbd></button><span class="grow"></span><button class="icon-btn" data-act="new-subpage" data-id="${q.id}" title="Ajouter une sous-page">${ic('file',15)}</button><button class="icon-btn" data-act="page-options" title="Options de la page">${ic('more',18)}</button></div><div class="paper-inner">${pageSyncNotice(q)}<div class="page-breadcrumb">${crumbs.length?crumbs.join(' / '):'Notes de l’affaire'} ${crumbs.length?' /':''}</div><input id="page-title" class="page-title-input" aria-label="Titre de la page" value="${esc(textLabel(q.title))}" placeholder="Sans titre" maxlength="250"><div id="editor">${q.blocks.map((b,i)=>renderBlock(b,i,q)).join('')}</div><div class="editor-footer flex between wrap"><button data-act="slash-end">${ic('plus',13)} Ajouter un bloc</button><span><kbd class="kbd">/</kbd> pour les commandes · Enregistrement automatique</span></div></div>`:empty('Un carnet pour cette affaire','Des pages, des sous-pages et des blocs pour retrouver vos informations.',btn('Créer une page','new-page','plus','','primary'))}</section></div>`}
function renderBlock(b,i,q){const editable=(tag='div',extra='')=>`<${tag} class="editable" contenteditable="true" data-block="${b.id}" data-placeholder="${b.type==='p'?'Écrivez, ou tapez / pour insérer un bloc…':b.type==='check'?'À faire…':'Écrivez ici…'}" ${extra}>${cleanHTML(b.html)}</${tag}>`;let content='';if(b.type==='affair-view')content=renderAffairView(b);if(['p','h1','h2','h3'].includes(b.type))content=editable(b.type==='p'?'div':b.type);else if(['bullet','number','check'].includes(b.type)){let number=1;if(b.type==='number')for(let j=i-1;j>=0&&q.blocks[j].type==='number';j--)number++;content=`<div class="block-list">${b.type==='check'?`<input type="checkbox" class="block-check" data-change="block-check" data-id="${b.id}" ${b.checked?'checked':''} aria-label="Cocher cette ligne">`:`<span class="bullet-marker">${b.type==='bullet'?'•':number+'.'}</span>`}${editable()}</div>`}else if(b.type==='quote')content=`<blockquote>${editable()}</blockquote>`;else if(b.type==='callout')content=`<div class="block-callout">${ic('info',18)}${editable()}</div>`;else if(b.type==='divider')content='<hr>';else if(b.type==='table')content=`<div class="table-wrap"><table class="note-table"><tbody>${b.cells.map((row,r)=>`<tr>${row.map((cell,c)=>`<${r===0?'th':'td'}><div class="editable" contenteditable="true" data-block="${b.id}" data-row="${r}" data-col="${c}" aria-label="Ligne ${r+1}, colonne ${c+1}">${cleanHTML(cell)}</div></${r===0?'th':'td'}>`).join('')}</tr>`).join('')}</tbody></table></div><div class="table-tools"><button data-act="table-row" data-id="${b.id}">+ Ligne</button><button data-act="table-col" data-id="${b.id}">+ Colonne</button><button data-act="table-options" data-id="${b.id}">Modifier la structure…</button></div>`;else if(b.type==='action'){let t=db.tasks.find(t=>t.id===b.ref);content=t?`<div class="block-link scope-frame" data-tranche="${esc(itemTranche(t))}">${ic('tasks',17)}<span class="badge">Action</span><button class="task-title grow" data-act="edit-task" data-id="${t.id}">${esc(textLabel(t.title))}</button>${contextBadges(itemContexts(t))}<span class="badge ${t.status==='done'?'green':t.status==='waiting'?'amber':''}">${STATES[t.status]}</span></div>`:'<div class="block-link muted">Action supprimée</div>'}else if(b.type==='page'){let p=pageById(b.ref);content=p?`<div class="block-link scope-frame" data-tranche="${esc(pageScope(p))}">${ic(pageIsSynced(p)?'link':'file',18)}<button class="task-title grow" data-act="open-page" data-id="${p.id}">${esc(textLabel(p.title))}</button>${ic('chevron',15)}</div>`:'<div class="block-link muted">Page supprimée</div>'}if(['project','document'].includes(b.type)){const r=referenceData(b.type,b.ref);content=r?`<div class="block-link scope-frame" data-tranche="${esc(scopeFor(b.type,r.item))}">${ic(r.icon,18)}${referenceHTML(b.type,b.ref)}${ic('chevron',15)}</div>`:'<div class="block-link muted">Lien indisponible : élément supprimé</div>'}return `<div class="block ${b.checked?'checked':''}" data-block-wrap="${b.id}"><div class="block-handle"><button class="icon-btn" data-act="slash-after" data-id="${b.id}" title="Insérer un bloc après">+</button><button class="icon-btn" data-act="block-options" data-id="${b.id}" title="Déplacer, dupliquer ou supprimer ce bloc">${ic('grip',14)}</button></div>${content}</div>`}
const DOC_STATUS={prepare:'À préparer',doing:'En cours',review:'À valider',ok:'Validé'};
function renderDocuments(p){const f=filtersFor('documents');let docs=db.documents.filter(d=>inScope(d,p)&&(!f.status||d.status===f.status)&&(!f.category||d.category===f.category)&&normalize([d.title,d.category,d.path,d.notes].join(' ')).includes(normalize(f.query)));return `<div class="toolbar"><p class="muted grow" style="font-size:12px">Les références utiles : liens internes, chemins de fichiers et suivi documentaire.</p>${btn('Ajouter un document','new-document','plus','','primary')}</div>${filterBar('documents',filterQuery('documents','Titre, référence, commentaire…')+filterSelect('documents','status','Statut',[['','Tous les statuts'],...Object.entries(DOC_STATUS)])+filterSelect('documents','category','Catégorie',[['','Toutes les catégories'],...[...new Set(db.documents.filter(d=>inScope(d,p)).map(d=>d.category).filter(Boolean))].sort().map(v=>[v,v])]),docs.length)}<section class="panel">${docs.map(d=>`<div class="doc-row scope-frame" data-tranche="${esc(itemTranche(d))}"><span class="affair-icon">${ic('file')}</span><div class="grow"><div class="flex wrap"><button class="task-title" data-act="edit-document" data-id="${d.id}">${esc(textLabel(d.title))}</button><span class="badge ${d.status==='ok'?'green':d.status==='review'?'amber':'blue'}">${DOC_STATUS[d.status]}</span>${d.category?`<small>${esc(d.category)}</small>`:''}</div>${d.notes?`<p class="muted" style="font-size:12px;margin-top:7px;white-space:pre-wrap">${renderText(d.notes)}</p>`:''}${d.path?`<div class="path">${safeHref(d.path)?`<a href="${esc(safeHref(d.path))}" target="_blank" rel="noopener noreferrer">${esc(d.path)}</a>`:esc(d.path)}</div><button class="copy-path" data-act="copy-document" data-id="${d.id}">${ic('copy',12)} Copier ${safeHref(d.path)?'le lien':'le chemin'}</button>`:'<small>Aucun lien ou chemin renseigné</small>'}</div><div>${dueLabel(d.due)}<button class="icon-btn" data-act="edit-document" data-id="${d.id}" title="Modifier">${ic('edit',15)}</button></div></div>`).join('')||empty('Les documents, au bon endroit','Ajoutez un lien SharePoint, une référence documentaire ou le chemin d’un fichier de votre ordinateur.')}</section><div class="notice mt">Les fichiers restent à leur emplacement d’origine. Pour un chemin local ou réseau, utilisez « Copier le chemin », puis collez-le dans l’Explorateur Windows. Le navigateur peut empêcher l’ouverture directe.</div>`}
function renderSettings(){return `<div class="page-head"><div><h1>Réglages</h1><p>Connexion, synchronisation et sauvegardes de votre espace.</p></div></div><div class="settings-grid">${cloudPanel()}${backupSettingsPanel()}<section class="panel"><div class="panel-head"><h2>Importer une sauvegarde</h2>${ic('upload')}</div><div class="panel-body stack"><p class="muted" style="font-size:13px">Sélectionnez un fichier JSON exporté par Repère. Vérifiez le nombre d’affaires, d’actions et de pages, puis confirmez la restauration. L’import remplace les données actuelles ; il ne les fusionne pas. En mode connecté, cette modification sera également synchronisée sur vos autres appareils.</p>${btn('Choisir un fichier JSON','import','upload')}<small>L’application propose d’exporter les données actuelles avant la restauration.</small><button class="text-button" data-act="recover">Restaurer la copie locale précédente…</button></div></section><section class="panel"><div class="panel-head"><h2>Mon espace</h2>${ic('user')}</div><form id="settings-form" class="panel-body stack"><label class="field">Prénom<input class="input" name="name" maxlength="50" required value="${esc(db.settings.name)}"></label>${select('Apparence','theme',[['light','Mode clair'],['dark','Mode sombre']],db.settings.theme)}<button class="btn" type="button" data-act="save-settings">Enregistrer</button><div class="notice">CA électrique : ${esc(db.contacts.find(c=>c.id===db.settings.selfContactId)?.name||"Ma fiche à renseigner")}</div>${btn("Choisir ma fiche","v110-self","user","","small")}<div class="flex wrap"><span class="badge">${db.projects.length} affaires</span><span class="badge">${db.pages.length} pages</span><span class="badge">${db.tasks.length} actions</span><span class="badge">${(new Blob([JSON.stringify(db)]).size/1024).toFixed(0)} Ko de données</span></div></form></section><section class="panel"><div class="panel-head"><h2>À savoir</h2>${ic('info')}</div><div class="panel-body manual"><p>Le fichier ouvert directement sur votre ordinateur reste local. La version Web utilise Firebase après connexion pour synchroniser vos données. Les documents liés restent dans leur emplacement d’origine.</p><p><strong>Conservez le même fichier HTML, au même emplacement, et utilisez le même navigateur et le même profil.</strong> Les données sont enregistrées dans ce navigateur, pas dans le fichier HTML. L’effacement des données du navigateur ou un changement d’emplacement peut les rendre inaccessibles.</p><p>En navigation privée, les données peuvent disparaître à la fermeture. Les exports JSON sont votre sauvegarde transportable. Les documents eux-mêmes ne sont pas inclus.</p></div></section></div>${renderElementCatalogue()}`}
function renderHelp(){const groups=[['Créer une synthèse','Ouvrez Synthèses dans le menu, ou le bouton Synthèse d’une affaire. Sélectionnez les affaires, projets TEM / AT, entreprises et blocs. DIPDE/CNEPE restent dans les informations générales. PDF / Imprimer ouvre l’impression du navigateur : choisissez Enregistrer au format PDF. Préparer un e-mail permet de copier les blocs mis en forme ou de télécharger un brouillon .eml, sans envoi automatique.'],['Prendre le bon départ','Créez une affaire, renseignez son contexte et ajoutez une action précise. La prochaine action est choisie selon son échéance et son urgence. L’étoile sert de favori à urgence et échéance égales. Complétez l’équipe et rattachez les entreprises, puis ajoutez les éléments adaptés au dossier dans Éléments d’affaires.'],['Séparer action et note','Une action a un statut, une échéance et éventuellement une relance. Une case à cocher dans une note sert à la prise de notes et ne remonte pas au tableau de bord. Utilisez /action ou /suivi pour rattacher une action existante à la page, ou en créer une si nécessaire. Son statut reste synchronisé avec le suivi de l’action.'],['Suivre une attente','Passez une action en « En attente », indiquez qui doit répondre et quand relancer. « Relancer » consigne votre suivi et décale le rappel ; il n’envoie aucun message. « Réponse reçue » vous laisse décider si l’action est terminée ou doit reprendre.'],['Les contacts de l’affaire','Dans Notes & pages, ouvrez Contacts de l’affaire pour ajouter des interlocuteurs et consulter leurs coordonnées. Chaque fiche est conservée dans le répertoire général, commun à toutes les affaires. Avec @, recherchez par nom ou entreprise. Cochez les personnes voulues, ou utilisez Tout sélectionner, puis Insérer (Ctrl + Entrée). Vous pouvez aussi créer une fiche complète : nom, entreprise, fonction, téléphone et e-mail. Dans une action, les personnes sélectionnées sont ajoutées aux interlocuteurs déjà affectés. Modifier une fiche met à jour ses coordonnées dans toutes les affaires.'],['Reprendre les informations d’une affaire','Tapez /affaire/ pour afficher les raccourcis Contacts, Actions, Préparation, Réalisation, Finalisation, Éléments d’affaires, Documents, Attentes, Échéances, Synthèse et Liens. Choisissez l’affaire source et le projet TEM / AT, ou toute l’affaire. La vue liée reste à jour ; la copie modifiable conserve les données au moment de l’insertion. Dans un champ de texte ou une cellule, l’insertion est une copie texte. /affaire/contactes fonctionne aussi.'],['Accéder à Cockpit CA','Le bouton Cockpit CA de Aujourd’hui utilise votre lien général. Dans une affaire, chaque projet T1/T2 × TEM/AT possède sa propre adresse, réglable avec Ajouter le lien ou Modifier le lien. /cockpit insère l’adresse du projet, /cockpit-general celle de Aujourd’hui. Il s’agit de liens, sans synchronisation avec Cockpit CA.'],['Organiser les pages','Chaque affaire possède ses pages. Le + à droite d’une page crée une sous-page. Le menu ··· permet de déplacer une page sous une autre, la dupliquer ou l’imprimer. La recherche Ctrl K parcourt aussi le contenu des tableaux.'],['Écrire avec les blocs','Tapez / dans vos notes, champs de texte et captures, ou utilisez le bouton / Commandes et Ctrl + Espace. Tapez @ pour chercher des interlocuteurs, notamment par entreprise, ou en créer un. Dans le menu /, les flèches puis Entrée valident une commande. Dans le menu @, Entrée coche une personne et Ctrl + Entrée insère la sélection. Échap ferme le menu. Entrée crée le bloc suivant ; Maj + Entrée fait un retour à la ligne. Dans un tableau, Tab passe à la cellule suivante et crée une ligne en fin de tableau.'],['Les projets TEM / AT','Une affaire regroupe jusqu’à quatre projets : T1 TEM, T1 AT, T2 TEM et T2 AT. TEM signifie tranche en marche ; AT signifie arrêt de tranche. Choisissez les projets dans Modifier ou Gérer TEM / AT. Chacun a sa préparation, sa réalisation, sa finition, ses dates et ses éléments. Les éléments transverses sont communs à toute cette affaire. Les anciennes données restent à préciser : attribuez chaque suivi existant à TEM ou AT pour conserver tout son contenu. Les éléments transverses et de réalisation sont ajoutés au départ. Complétez les autres phases selon votre dossier.'],['Actions communes et pages synchronisées','Cochez plusieurs projets dans une action pour partager son statut, son échéance et ses relances. Créez des actions distinctes pour suivre des réalisations indépendantes. Avec /page, une page peut être synchronisée entre projets ; son contenu reste commun. Les contacts et le dossier SharePoint appartiennent à toute l’affaire.'],['Retrouver avec les filtres','Les filtres se combinent : tranche, TEM / AT et phase doivent correspondre au même projet. Une action partagée apparaît une seule fois dans Toutes les actions. Filtrez aussi par urgence, interlocuteur, statut ou échéance ; les attentes par date de relance ; les documents par statut et catégorie ; les contacts par entreprise. Réinitialiser retire les filtres de la vue. Ils restent actifs pendant cette session.'],['Suivre la réalisation et gagner en lisibilité','L’accueil de l’affaire affiche le taux de réalisation des éléments applicables de chaque phase. Les actions sont comptées séparément. Tout terminer et Remettre à faire agissent sur les éléments de la section après confirmation ; les éléments communs restent partagés. Annuler permet de revenir en arrière. T1 est en bleu, T2 en vert, et les éléments communs portent un cadre bleu et vert. Le bouton Sombre / Clair en haut de l’écran mémorise votre préférence.'],['Retrouver les archives','Une affaire archivée ou terminée quitte les actions du quotidien. Ses notes et actions restent accessibles dans le dossier et dans la recherche. L’archivage se fait avec le bouton Modifier de l’affaire.']];return `<div class="page-head"><div><h1>Votre espace, en pratique</h1><p>Un outil simple à ouvrir, assez souple pour accompagner vos dossiers.</p></div><span class="badge green">Version ${VERSION}</span></div><div class="settings-grid"><section class="panel"><div class="panel-body manual">${groups.map(([t,b])=>`<div><h3>${t}</h3><p>${b}</p></div>`).join('')}</div></section><div class="stack"><section class="panel"><div class="panel-head"><h2>Commandes /</h2></div><div class="panel-body"><p class="muted" style="font-size:12px">Tapez une partie du nom : « tab », « réunion », « action »…</p><table class="help-table">${COMMANDS.map(c=>`<tr><td><code>/${esc(c.command)}</code><br>${esc(c.label)}</td><td style="color:var(--muted);text-align:left;padding-left:15px">${esc(c.desc)}</td></tr>`).join('')}</table></div></section><section class="panel"><div class="panel-head"><h2>Raccourcis clavier</h2></div><div class="panel-body"><table class="help-table">${[['Rechercher partout','Ctrl K'],['Gras / italique / souligné','Ctrl B / I / U'],['Sauvegarde JSON','Ctrl S'],['Commandes partout','Ctrl Espace /'],['Interlocuteurs / entreprise','@'],['Insérer les contacts cochés','Ctrl Entrée'],['Bloc suivant','Entrée'],['Retour à la ligne','Maj Entrée'],['Naviguer dans un tableau','Tab / Maj Tab'],['Fermer un menu','Échap']].map(([a,b])=>`<tr><td>${a}</td><td><kbd class="kbd">${b}</kbd></td></tr>`).join('')}</table></div></section></div></div>`}
function suspendModal(){const host=$('#modal-root');if(!host.firstChild)return;modalStack.push({nodes:[...host.childNodes],submit:modalSubmit,returnTo:modalReturn});host.replaceChildren();modalSubmit=null;modalReturn=null}
function closeModal(){closeSlash();const old=$('#modal-root'),returnTo=modalReturn;old.replaceChildren();modalSubmit=null;modalReturn=null;const previous=modalStack.pop();if(previous){old.replaceChildren(...previous.nodes);modalSubmit=previous.submit;modalReturn=previous.returnTo}if(returnTo&&document.contains(returnTo))returnTo.focus();if(cloud.view.status==='remote')cloudSchedule()}
function commandDialog(open){suspendModal();open()}
function showFormError(form,message){let box=form?.querySelector('[data-form-error]');if(box){box.textContent=message;box.classList.remove('hidden')}else toast(message)}
function formValues(form){
 const values={};
 for(const el of Array.from(form.elements||[])){
  if(!el.name||el.disabled||['button','submit','reset','file'].includes(el.type))continue;
  if(['checkbox','radio'].includes(el.type)&&!el.checked)continue;
  values[el.name]=typeof el.value==='string'?el.value:'';
 }
 return values;
}
function validForm(form){
 let error=form.querySelector('[data-form-error]');if(error){error.textContent='';error.classList.add('hidden')}
 for(const el of Array.from(form.elements||[])){
  if(el.disabled||!el.name)continue;
  if(el.required&&typeof el.value==='string'&&!el.value.trim()){
   showFormError(form,'Renseignez le champ obligatoire : '+(el.closest('label')?.firstChild?.textContent?.trim()||el.name)+'.');el.focus();return false;
  }
  if(el.validity&&!el.validity.valid){showFormError(form,el.validationMessage||'Vérifiez la valeur de ce champ.');el.focus();return false}
 }
 return true;
}
function submitModalForm(){
 const form=$('#modal-form');if(!form||!modalSubmit||modalBusy||!validForm(form))return;
 const handler=modalSubmit;modalBusy=true;
 try{handler(formValues(form),form)}catch(error){showFormError(document.contains(form)?form:null,'L’enregistrement n’a pas pu aboutir : '+error.message)}finally{modalBusy=false}
}
function saveCaptureForm(){const form=$('#capture-form');if(!form||!validForm(form))return;const text=(formValues(form).text||'').trim();if(text)change(()=>db.captures.unshift({id:uid(),text,createdAt:stamp()}),'Information capturée.')}
function saveSettingsForm(){const form=$('#settings-form');if(!form||!validForm(form))return;const name=(formValues(form).name||'').trim();if(name)change(()=>{db.settings.name=name;const theme=formValues(form).theme;if(['light','dark'].includes(theme))db.settings.theme=theme},'Réglages enregistrés.')}
function modal(title,subtitle,body,onSubmit=null,wide=false){
 closeSlash();modalReturn=document.activeElement;modalSubmit=onSubmit;
 const {content,footer}=typeof body==='string'?dialogBody(body):body;
 const sections=`<div class="modal-body">${onSubmit?'<div class="notice error hidden" data-form-error role="alert"></div>':''}${content}</div>${footer}`;
 $('#modal-root').innerHTML=`<div class="modal-overlay"><section data-tranche="${ui.view==='project'?esc(selectedTranche()):''}" class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" ${subtitle?'aria-describedby="modal-subtitle"':''}><div class="modal-head"><div><h2 id="modal-title">${esc(title)}</h2>${subtitle?`<p id="modal-subtitle">${esc(subtitle)}</p>`:''}</div><button type="button" class="icon-btn" data-act="close-modal" aria-label="Fermer">${ic('close')}</button></div>${onSubmit?`<form id="modal-form" novalidate>${sections}</form>`:sections}</section></div>`;
 $$('#modal-root input,#modal-root textarea').forEach(updateFieldLinkPreview);
 setTimeout(()=>{const fields=$$('#modal-root input:not([type=checkbox]),#modal-root textarea,#modal-root select').filter(e=>!e.disabled&&e.getClientRects().length);(fields[0]||$('#modal-root button'))?.focus()},30)
}
const dialogBody=(content,footer='')=>({content,footer});
const actions=(save='Enregistrer',extra='')=>`<div class="form-actions">${extra}<button type="button" class="btn" data-act="close-modal">Annuler</button><button type="button" class="btn primary" data-act="save-modal">${save}</button></div>`;
const field=(label,name,value='',type='text',extra='')=>`<label class="field">${label}<input class="input" type="${type}" name="${name}" value="${esc(value)}" ${extra}></label>`, textarea=(label,name,value='',extra='')=>`<label class="field full">${label}<textarea name="${name}" ${extra}>${esc(value)}</textarea></label>`, select=(label,name,options,value)=>`<label class="field">${label}<select name="${name}">${options.map(([k,v])=>`<option value="${esc(k)}" ${value===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;

function dedupeSyncedPages(data){
 const groups=new Map(),redirects=new Map();
 for(const p of data.pages){const source=pageSource(p,data.pages);if(!source)continue;const key=JSON.stringify([source.id,p.projectId,p.contextKey||p.tranche]);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)}
 for(const pages of groups.values()){if(pages.length<2)continue;const keep=pages.find(p=>!p.sourcePageId)||pages[0];for(const p of pages)if(p!==keep)redirects.set(p.id,keep.id)}
 if(!redirects.size)return;
 const remap=id=>redirects.get(id)||id,oldParents=new Map(data.pages.map(p=>[p.id,p.parentId]));
 const rewrite=s=>typeof s==='string'?s.replace(/#repere\/page\/([-a-zA-Z0-9_]{1,100})/g,(_,id)=>'#repere/page/'+remap(id)):s;
 function visit(value){if(!value||typeof value!=='object')return;for(const key of Object.keys(value)){if(typeof value[key]==='string')value[key]=rewrite(value[key]);else visit(value[key])}}
 visit(data);
 for(const p of data.pages){let parent=p.parentId;const seen=new Set([p.id]);while(parent&&remap(parent)===remap(p.id)&&!seen.has(parent)){seen.add(parent);parent=oldParents.get(parent)||''}p.parentId=remap(parent)===remap(p.id)?'':remap(parent);for(const b of p.blocks)if(b.type==='page')b.ref=remap(b.ref)}

}
function createLinkedPage(mode){

function filteredCommands(){if(!slash)return [];const query=normalize(slash.query.replace(/^[/@]/,'').trim());if(slash.kind==='@'){const list=mentionMatches().map(c=>({id:c.id,label:c.name,desc:[c.company,c.role,c.phone,c.email].filter(Boolean).join(' · ')||'Interlocuteur enregistré',icon:'user',group:'Interlocuteurs'}));if(query&&!db.contacts.some(c=>normalize(c.name)===query))list.push({id:'create-contact',label:db.contacts.some(c=>normalize(c.company)===query)?'Créer un contact de cette entreprise':'Créer « '+slash.query.replace(/^@/,'').trim()+' »',desc:'Renseigner nom, entreprise, fonction, téléphone et e-mail',icon:'plus',group:'Nouveau'});return list}return COMMANDS.filter(c=>normalize(c.command+' '+c.label+' '+c.keys+' '+c.group).includes(query)).sort((a,b)=>Number(normalize(b.command)===query)-Number(normalize(a.command)===query))}

function commandCatalogHTML(){const groups=[...new Set(COMMANDS.map(c=>c.group))];return `<div class="command-guide"><div class="notice"><strong>@ pour les personnes et les entreprises.</strong> Recherchez par nom, entreprise, fonction, téléphone ou e-mail. Cochez les personnes voulues ou utilisez Tout sélectionner, puis cliquez sur Insérer (Ctrl + Entrée). Dans une action, elles rejoignent les interlocuteurs déjà affectés. Si nécessaire, créez une fiche complète avec l’entreprise et les coordonnées.</div><p><strong>/affaire/…</strong> reprend les contacts, actions, phases, documents et autres informations de l’affaire choisie. Dans une note, choisissez une vue liée à jour ou une copie modifiable. Dans un champ de texte, une copie est insérée. <strong>/cockpit</strong> et <strong>/cockpit-general</strong> insèrent vos liens Cockpit CA.</p><p>Dans les notes, les commandes insèrent des blocs et des liens. Dans les champs de texte, elles insèrent du texte et des liens lisibles après enregistrement. Sans champ actif, les modèles créent une page dans l’affaire de votre choix.</p>${groups.map(group=>`<section><h3>${group}</h3><table class="help-table"><tbody>${COMMANDS.filter(c=>c.group===group).map(c=>`<tr><td><code>/${c.command}</code></td><td>${c.desc}</td></tr>`).join('')}</tbody></table></section>`).join('')}<p class="muted">/lien et /liens retrouvent la même commande. Avec /action ou /suivi, choisissez une action existante ou créez-en une. La page montre son statut à jour sans la dupliquer. /page, /document, /affaire et /interlocuteur proposent le même choix. Les cases des modèles restent des cases de note. Les dossiers SharePoint sont des accès à vos documents, sans synchronisation automatique.</p></div>`}

function handleUniversalShortcut(e){const altGraph=e.getModifierState?.('AltGraph')||(e.ctrlKey&&e.altKey&&['/','@'].includes(e.key));if(e.isComposing||(e.altKey&&!altGraph)||e.target.closest?.('.slash-menu'))return false;const typing=e.target.matches?.('input,textarea,[contenteditable="true"]');if((e.ctrlKey||e.metaKey)&&e.code==='Space'){e.preventDefault();openContextMenu('/',commandContext(e.target));return true}if(((e.ctrlKey||e.metaKey)&&!altGraph)||!['/','@'].includes(e.key))return false;
 if(typing){if(e.target.dataset?.filterScope)return false;if(e.target.disabled||e.target.readOnly||e.target.type==='date'||e.target.type==='email'||e.target.type==='url'||['global-search','reference-query','contact-query','affair-query','task-query','slash-search'].includes(e.target.id))return false;let before='';if(e.target.matches('.editable')){const sel=window.getSelection();if(sel.rangeCount){const r=sel.getRangeAt(0).cloneRange();r.selectNodeContents(e.target);r.setEnd(sel.getRangeAt(0).startContainer,sel.getRangeAt(0).startOffset);before=r.toString()}}else{if(!['text','search','textarea','tel',''].includes(e.target.type||''))return false;before=e.target.value.slice(0,e.target.selectionStart??e.target.value.length)}if(before&&!/\s$/.test(before))return false;e.preventDefault();openContextMenu(e.key,commandContext(e.target));return true}

}

function splitBlock(el){let p=currentPage(),b=p.blocks.find(b=>b.id===el.dataset.block);if(!b)return;if(!plain(el.innerHTML).trim()&&['bullet','number','check'].includes(b.type)){change(()=>{b.type='p';b.html=''});focusBlock(b.id);return}let sel=window.getSelection(),tail='';if(sel.rangeCount){let r=sel.getRangeAt(0);if(el.contains(r.startContainer)&&el.contains(r.endContainer)){r.deleteContents();let after=document.createRange();after.selectNodeContents(el);after.setStart(r.startContainer,r.startOffset);let temp=document.createElement('div');temp.append(after.extractContents());tail=cleanHTML(temp.innerHTML)}}b.html=cleanHTML(el.innerHTML);let next=newBlock(['bullet','number','check'].includes(b.type)?b.type:'p',tail);change(()=>{p.blocks.splice(p.blocks.indexOf(b)+1,0,next);p.updatedAt=stamp()});focusBlock(next.id,null,null,false)}

document.addEventListener('change',e=>{let a=e.target;if(a.dataset.dossierFilter){ui.dossierCompany=a.value;render();return}if(handleSynthesisChange(a)||handleElementCommentChange(a)||handleElementReferenceInput(a))return;if(a.dataset.filterScope){applyViewFilter(a);return;}if(a.matches('[data-change]')){let act=a.dataset.change;if(act==='element-all-phases'){ui.showAllElementPhases=a.checked;render()}else if(act==='v19-element-state'){const element=db.elements.find(e=>e.id===a.dataset.id);if(element)change(()=>setElementState(element,a.value),'État mis à jour.')}else if(act==='check-status'){const element=db.elements.find(e=>e.id===a.dataset.id);if(element)change(()=>setElementState(element,a.value))}else if(act==='block-check'){let b=currentPage().blocks.find(b=>b.id===a.dataset.id);change(()=>b.checked=a.checked)}else if(act==='affair-phase'){ui.affairPhase=a.value;render()}else if(act==='task-filter'){ui.taskFilter=a.value;render()}else if(act==='task-project'){ui.taskProject=a.value;render()}else if(act==='task-tranche'){ui.taskTranche=a.value;render()}}});
document.addEventListener('input',e=>{let a=e.target;if(handleSynthesisInput(a)||handleElementCommentInput(a)||handleElementReferenceInput(a))return;if(a.dataset.filterScope){applyViewFilter(a);return;}updateFieldLinkPreview(a);if(a.dataset.elementNotes){resizeCheckNotes(a);const el=db.elements.find(e=>e.id===a.dataset.elementNotes);if(el){el.notes=a.value;queueSave()}}else if(a.dataset.checkNotes){resizeCheckNotes(a);const owner=project(a.dataset.project),run=runFor(owner,a.dataset.context||a.dataset.tranche),item=run?.checks.find(c=>c.id===a.dataset.checkNotes);if(item){item.notes=a.value;queueSave()}}else if(a.name==='contact'&&a.closest('#modal-form')){updateContactAssignmentInput(a);}else if(a.matches('.editable'))updateEditable(a);else if(a.id==='contact-query'){$('#contact-results').innerHTML=contactCards(a.value)}else if(a.id==='page-title'){let p=currentPage();p.title=a.value||'Sans titre';p.updatedAt=stamp();queueSave()}else if(a.id==='affair-query'){ui.affairQuery=a.value;let archive=ui.view==='archives';$('#affair-results').innerHTML=affairCards(db.projects.filter(p=>p.archived===archive&&(projectHasPhase(p,ui.affairPhase))&&normalize([p.title,p.reference,p.tranche].join(' ')).includes(normalize(ui.affairQuery))),archive)}else if(a.id==='task-query'){ui.query=a.value;const start=a.selectionStart,end=a.selectionEnd;render();$('#task-query').focus();$('#task-query').setSelectionRange(start,end)}});
let lastCommandTarget=null;
document.addEventListener('focusin',e=>{if(e.target.matches('.editable'))lastEditable=e.target;if(e.target.matches('input,textarea,.editable')&&!e.target.closest('.slash-menu'))lastCommandTarget=e.target});
document.addEventListener('selectionchange',()=>{let s=window.getSelection();if(s.rangeCount){let r=s.getRangeAt(0);let parent=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement;if(parent?.closest('.editable'))savedRange=r.cloneRange()}});
document.addEventListener('focusout',e=>{if(isElementCommentField(e.target))refreshElementCommentField(e.target);else if(e.target.dataset.checkNotes){let links=e.target.parentElement.querySelector('.check-notes-links');if(!links){links=document.createElement('div');links.className='check-notes-links';e.target.parentElement.append(links)}links.innerHTML=renderTextLinks(e.target.value)}if(e.target.matches('.editable'))updateEditable(e.target);if(e.target.id==='page-title'){const p=currentPage(),link=$(`.page-link[data-id="${p?.id}"]`);if(link){link.textContent=p.title;link.title=p.title}}});
document.addEventListener('mousedown',e=>{const b=e.target.closest('.format-btn');if(b){e.preventDefault();let target=lastEditable;if(!target||!document.contains(target))return;restoreSelection(target);document.execCommand(b.dataset.format,false,b.dataset.format==='hiliteColor'?'#f7eac0':null);updateEditable(target)}});
document.addEventListener('paste',e=>{const el=e.target.closest('.editable');if(!el)return;e.preventDefault();let html=e.clipboardData.getData('text/html'),text=e.clipboardData.getData('text/plain');document.execCommand('insertHTML',false,html?cleanHTML(html):esc(text).replace(/\n/g,'<br>'));updateEditable(el)});
document.addEventListener('keydown',e=>{
 if(e.defaultPrevented||e.target.closest?.('.slash-menu'))return;
 if(handleUniversalShortcut(e))return;
 if(e.key==='Enter'&&!e.isComposing&&!e.shiftKey&&e.target.matches('input')&&e.target.closest('#modal-form')){e.preventDefault();submitModalForm();return}
 if(e.key==='Enter'&&!e.isComposing&&(e.ctrlKey||e.metaKey)&&e.target.closest('#capture-form')){e.preventDefault();saveCaptureForm();return}
 if(e.key==='Enter'&&!e.isComposing&&e.target.matches('input')&&e.target.closest('#settings-form')){e.preventDefault();saveSettingsForm();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandDialog(searchDialog);return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportData();return}
 if(e.key==='Escape'){if(slash)closeSlash(true);else if($('#modal-root').innerHTML)closeModal();else closeMobileNavigation();return}
 if($('#modal-root').innerHTML&&e.key==='Tab'){const focusable=$$('#modal-root button,#modal-root input,#modal-root select,#modal-root textarea,#modal-root a[href]').filter(el=>!el.disabled&&el.getClientRects().length);let first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}return}
 let el=e.target.closest('.editable');if(!el||e.isComposing)return;let p=currentPage(),b=p?.blocks.find(b=>b.id===el.dataset.block);if(!b)return;
 if(el.dataset.row!==undefined){if(e.key==='Tab'){e.preventDefault();let r=+el.dataset.row,c=+el.dataset.col,cols=b.cells[0].length,at=r*cols+c+(e.shiftKey?-1:1);if(at<0)return;if(at>=b.cells.length*cols){if(b.cells.length>=200)return;change(()=>b.cells.push(Array(cols).fill('')))}focusBlock(b.id,Math.floor(at/cols),at%cols)}return}
 if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!plain(el.innerHTML).trim()){e.preventDefault();openSlash(b.id);return}
 if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();splitBlock(el);return}
 if(e.key==='Backspace'&&!plain(el.innerHTML).trim()&&p.blocks.length>1){e.preventDefault();let at=p.blocks.indexOf(b),prev=p.blocks[Math.max(0,at-1)];change(()=>p.blocks.splice(at,1));focusBlock(prev.id);return}
 if(e.key===' '&&b.type==='p'){let map={'#':'h1','##':'h2','###':'h3','-':'bullet','*':'bullet','1.':'number','[]':'check','[ ]':'check','>':'quote'},type=map[plain(el.innerHTML).trim()];if(type){e.preventDefault();change(()=>{b.type=type;b.html=''});focusBlock(b.id)}}
});
document.addEventListener('submit',e=>{if(['modal-form','capture-form','settings-form'].includes(e.target.id)){e.preventDefault();if(e.target.id==='modal-form')submitModalForm();else if(e.target.id==='capture-form')saveCaptureForm();else saveSettingsForm()}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>15000000){toast('Ce fichier est trop volumineux (15 Mo maximum).');return}try{proposeRestore(JSON.parse(await file.text()),file.name)}catch(err){toast('Le fichier JSON ne peut pas être lu : '+err.message)}});
document.addEventListener('toggle',e=>{if(e.target.matches?.('details.checklist')&&e.target.open)resizeAllCheckNotes()},true);
window.addEventListener('resize',resizeAllCheckNotes);
window.addEventListener('resize',()=>{if(innerWidth>700)ui.mobileNavOpen=false;applySidebarLayout()});
window.addEventListener('beforeunload',e=>{if(dirty)persist();if(dirty||storageError||conflict||hasUnexportedChanges()||cloudHasPending()){e.preventDefault();e.returnValue=''}});
window.addEventListener('storage',e=>{if(cloud.locked)return;if(e.key===EXPORT_STATE){exportState=readExportState();refreshBackupStatus()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)persist()});
render();

document.addEventListener('toggle',e=>{const phase=e.target.dataset?.elementPhase;if(!Object.hasOwn(ELEMENT_PHASES,phase)||!document.contains(e.target))return;const open=e.target.open;if(db.settings.elementSections[phase]!==open){db.settings.elementSections[phase]=open;queueSave()}if(open)resizeAllCheckNotes()},true);

document.addEventListener('keydown',event=>{
 const tab=event.target.closest?.('[role="tab"][data-tab]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
 event.preventDefault();const keys=['summary','elements','actions','notes','documents'],i=keys.indexOf(tab.dataset.tab),next=event.key==='Home'?0:event.key==='End'?keys.length-1:(i+(event.key==='ArrowRight'?1:-1)+keys.length)%keys.length;
 if(dirty)persist();ui.tab=keys[next];render();$('#project-tab-'+ui.tab)?.focus();
});
document.addEventListener('click',event=>{for(const menu of $$('.v118-menu[open]'))if(!menu.contains(event.target))menu.open=false});

if(typeof setInterval==='function')setInterval(refreshRequestClocks,30000);
document.addEventListener('visibilitychange',refreshRequestClocks);

// Check wall-clock deadlines instead of counting timer ticks (sleep/background tabs).
if(typeof setInterval==='function')setInterval(()=>{autoExportTick();refreshBackupStatus()},15000);
setTimeout(autoExportTick,15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='hidden'){autoExportTick();refreshBackupStatus()}});
$('#backup-verify-file').addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';await verifyBackupFile(file)});
document.addEventListener('submit',event=>{if(event.target.id==='backup-settings-form'){event.preventDefault();saveBackupSettings()}});


cloudInit();
</script>
</body>

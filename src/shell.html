<style>

:root{--sidebar:236px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea,[contenteditable]{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.42}
a{text-underline-offset:3px}
button svg,span svg{flex-shrink:0}
svg{vertical-align:middle;stroke-width:1.7}
h1,h2,h3,p{margin:0}
h1{font-size:var(--fs-6);line-height:1.25;letter-spacing:-1px;font-weight:650}
h2{font-size:var(--fs-4);font-weight:650;letter-spacing:-.35px}
h3{font-size:var(--fs-3);font-weight:650}
small{font-size:var(--fs-1)}
.eyebrow{font-size:var(--fs-1);letter-spacing:1.6px;text-transform:uppercase;font-weight:700}
.hidden{display:none!important}
.flex{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:18px}
.mt{margin-top:20px}
.mb{margin-bottom:20px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-1);font-weight:600;padding:3px 7px;white-space:nowrap}
.dot{width:6px;height:6px;display:inline-block}
.kbd{font:11px/1.7 monospace;padding:0 5px}
.panel{overflow:hidden}
.panel-head{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-body{padding:22px}
.empty{padding:35px 22px;text-align:center}
.empty svg{margin-bottom:12px}
.empty h3{margin-bottom:6px}

.input,select,textarea{width:100%;padding:9px 11px;min-width:0}

.full{grid-column:1/-1}

.notice{padding:12px 15px;font-size:var(--fs-1)}

.brand{display:flex;align-items:center;gap:10px;padding:0 9px 27px;font-size:var(--fs-5);font-weight:720;letter-spacing:-.8px}

.nav-count{font-size:var(--fs-1);padding:0 5px;margin-left:auto}
.sidebar-line{height:1px;margin:18px 9px}

.profile{margin-top:15px;padding:15px 8px 0}

.v121-references[data-tranche="T2"]{--ref-accent:var(--t2)}
.v121-references .panel-head{padding:10px 14px;border-bottom:1px solid var(--line-strong);min-height:48px}.v121-references h2{font-size:16px;line-height:1.3}
.v121-tranche{font-size:13px;font-weight:800;color:var(--ref-accent);border:1px solid var(--ref-accent);border-radius:4px;padding:3px 7px;white-space:nowrap}.v121-context-note{font-size:12px;color:var(--muted);font-weight:600}
.v121-global-refs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-bottom:1px solid var(--line-strong)}.v121-global-ref{display:flex;align-items:center;gap:18px;padding:5px 14px;min-width:0}.v121-global-ref+div{border-left:1px solid var(--line-strong)}.v121-global-ref>strong{font-size:14px;min-width:24px}.v121-global-ref .v121-ref-cell{flex:1}
.v121-ref-cell{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px;min-width:0}.v121-ref-cell>div{min-width:0;flex:1}.v121-ref-cell+.v121-ref-cell{border-top:1px dashed var(--line-strong);margin-top:4px;padding-top:4px}
.v121-ref-value{display:block;padding:5px 0;text-align:left;font-size:15px;font-weight:750;color:var(--ink);line-height:1.35;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;min-height:30px;width:100%}.v121-ref-value:hover{text-decoration:underline}.v121-ref-value.is-empty{font-size:13px;font-weight:500;color:var(--muted)}
.v121-ref-scope,.v121-review{display:block;font-size:12px;font-weight:500;line-height:1.4;margin:0 0 4px;color:var(--muted)}.v121-review{color:var(--amber);font-weight:650}.v121-more{flex-shrink:0;width:30px;min-width:30px;height:30px}
.v121-table-wrap{overflow-x:auto}.v121-ref-table,.v121-regime-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px;line-height:1.4;background:var(--paper)}.v121-ref-table{min-width:640px}.v121-regime-table{min-width:720px}
.v121-ref-table th,.v121-ref-table td,.v121-regime-table th,.v121-regime-table td{padding:6px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.v121-ref-table thead th,.v121-regime-table thead th{background:var(--surface);border-bottom:1px solid var(--line-strong);font-size:12px;font-weight:750;color:var(--ink);padding-top:8px;padding-bottom:8px}
.v121-ref-table td+td,.v121-ref-table th+td{border-left:1px solid var(--line)}.v121-ref-table tbody th{font-size:14px;font-weight:750}.v121-ref-table tbody tr:nth-child(even),.v121-regime-table tbody tr:nth-child(even){background:var(--surface)}
.v121-regime-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line-strong)}.v121-regime-header h3{font-size:15px;margin:0}.v121-regime-header h3 span{font-size:13px;font-weight:500;color:var(--muted);margin-left:7px}
.v121-regime-table tbody tr{height:48px}.v121-regime-table .v121-type{font-size:12px;font-weight:750}.v121-regime-table tbody th{font-weight:500}.v121-regime-object{display:block;color:var(--muted);font-size:13px;font-weight:400;line-height:1.4;padding-bottom:3px;white-space:normal}
.v121-projects{display:flex;flex-wrap:wrap;gap:4px}.v121-projects .badge{font-size:12px}.v121-status{display:block;padding:5px 0;font-size:15px;font-weight:750;line-height:1.3;text-align:left;color:var(--ink);min-height:30px}.v121-status:hover{text-decoration:underline}
.v121-due{display:block;font-variant-numeric:tabular-nums}.v121-due .due{font-size:12px}.v121-urgent{display:block;color:var(--red);font-size:12px;line-height:1.4}.v121-regime-table tr[data-urgent="true"]{background:var(--red-soft)}
.v121-filter{display:flex;align-items:center;position:relative}.v121-filter>summary{list-style:none;cursor:pointer}.v121-filter>summary::-webkit-details-marker{display:none}.v121-filter[open]{border:1px solid var(--line-strong);border-radius:4px;padding:3px}.v121-filter[open]>summary{display:inline-flex;vertical-align:middle}.v121-filter label{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding-right:5px}.v121-filter:not([open])>label{display:none}.v121-filter select{width:180px;font-size:13px;min-height:30px;padding:4px 7px}.v121-active-filter{font-size:12px;color:var(--muted)}
.v121-empty{padding:10px 14px;font-size:13px;color:var(--muted);margin:0}.v121-options{display:grid;gap:8px}.v121-options .btn{justify-content:flex-start;min-height:40px}
.syn119-report .syn121-tranche{margin:12px 0 5px;font-size:15px;border-bottom:2px solid #333;padding-bottom:4px}.syn119-report .syn120-refs-table th,.syn119-report .syn120-regimes th{text-align:left}.syn119-report .syn120-regimes tbody th{background:transparent;font-weight:650}.syn119-report .syn120-refs-table th:first-child{width:22%}
@media(max-width:700px){.v121-global-refs{grid-template-columns:1fr}.v121-global-ref+div{border-left:0;border-top:1px solid var(--line)}.v121-filter label{flex-wrap:wrap}.v121-regime-header>.flex{justify-content:flex-end}.v121-reference-note{display:none}}
@media print{#synthesis-print .syn121-tranche{break-after:avoid}#synthesis-print .syn120-refs-table thead,#synthesis-print .syn120-regimes thead{display:table-header-group}}

/* v1.22 — affair first; lightweight requests without a project */
.v122-task-owner{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap;margin-bottom:2px;line-height:1.3}.v122-task-owner>strong,.v122-affair-name{font-size:15px;font-weight:750;color:var(--ink);text-align:left;overflow-wrap:anywhere;padding:0;line-height:1.3;min-height:24px}.v122-affair-name:hover{text-decoration:underline}
.v118-task-main .v122-action-title,.v118-wait-row .v122-action-title,.v118-home-item .v122-action-title{display:block;font-size:14px;font-weight:500;color:var(--ink);line-height:1.4;white-space:normal;text-align:left;overflow-wrap:anywhere;min-height:24px;padding:0}.v118-task-main:has(>.v122-action-title):not(:has(.v122-task-owner)) .v122-action-title{font-weight:650}
.v122-request-kind{font-size:12px;color:var(--muted);font-weight:600;border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px;white-space:nowrap}.v122-request-row{background:var(--paper);border-bottom:1px solid var(--line);color:var(--ink)}.v122-request-row[data-attention="urgent"],.v122-request-row[data-attention="late"]{background:var(--red-soft)}
.v122-request-priority-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:3px}.v122-priority{font-size:13px;line-height:1.4;color:var(--ink);font-weight:750}.v122-priority[data-priority="now"],.v122-priority[data-priority="hour"]{color:var(--red)}.v122-priority[data-priority="day"]{color:var(--amber)}.v122-priority[data-priority="asap"]{color:var(--muted)}.v122-manual{font-size:12px;color:var(--muted)}.v122-time{font-size:12px;color:var(--muted);display:block;line-height:1.4;font-variant-numeric:tabular-nums}.v122-time.is-late{color:var(--red);font-weight:700}
.v122-priority-preview{padding:9px 11px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);display:grid;gap:4px}.v122-priority-preview>strong{font-size:16px}.v122-priority-preview>span{font-size:13px;color:var(--muted)}.v122-rules{margin-top:12px}.v122-rules summary{font-size:13px;cursor:pointer;min-height:28px}.v122-rules table{font-size:12px;width:100%;margin:8px 0}.v122-rules th,.v122-rules td{padding:7px;border-bottom:1px solid var(--line);text-align:left}
.v122-home-requests .panel-head{padding:10px 12px;gap:7px}.v122-home-requests h2{font-size:15px}.v122-home-requests .panel-head .btn{padding:5px 7px}.v122-home-requests .v118-task-row{display:grid;grid-template-columns:26px minmax(0,1fr) 30px;gap:9px;padding:9px 11px;align-items:start}.v122-home-requests .task-check{margin-top:3px}.v122-home-requests .v118-task-end{display:flex;flex-direction:column;align-items:flex-end}.v122-home-requests .v122-time{display:none}.v122-home-requests .v118-task-meta{display:block}.v122-home-requests .v118-meta-text{display:block;white-space:normal}.v122-home-requests .v122-task-owner>strong{font-size:14px}.v122-home-requests .v122-request-kind{border:0;padding:0}.v122-home-requests .v122-task-owner{gap:5px}.v122-home-requests .v122-task-owner .v122-request-kind:after{content:' ·';margin-left:3px}.v122-home-requests .v118-list-more{padding:9px 12px;font-size:13px}
@media(max-width:1050px){.v122-home-requests{grid-row:1}.v118-home-side:has(.v122-home-requests){min-width:0}}

.v118-home-grid{grid-template-areas:"main requests" "main side";grid-template-rows:min-content 1fr}.v118-home-main{grid-area:main}.v118-home-side{grid-area:side}.v122-home-requests{grid-area:requests;overflow:visible}
.v122-request-clock{font-size:12px;color:var(--muted);font-weight:500;line-height:1.4}.v122-request-clock.is-late{color:var(--red);font-weight:750}.v122-request-row .v118-task-end>.v122-time{display:none}
@media(max-width:1150px){.v118-home-grid{grid-template-areas:"requests" "main" "side";grid-template-rows:auto}.v122-home-requests{grid-row:auto}}

/* v1.23 — Compact backup status remains reachable with the sidebar closed. */
.v123-backup-status{white-space:nowrap;gap:6px;max-width:210px}
.v123-backup-status.warn{color:var(--amber);border-color:currentColor;background:var(--amber-soft)}
.v123-backup-status span{overflow:hidden;text-overflow:ellipsis}
.v123-backup-detail{border:1px solid var(--line);border-radius:var(--r-card);padding:12px;background:var(--paper)}
.v123-backup-detail p{margin:6px 0 0;font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.v123-backup-filename{font-family:var(--mono,monospace)}
.v123-backup-check{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.4}
.v123-backup-check input{margin-top:3px;flex:none;accent-color:var(--brand)}
.v123-backup-panel details summary{cursor:pointer;font-size:13px;font-weight:600;padding:6px 0}
.v123-backup-panel details .manual{font-size:13px;margin-top:6px}
@media(max-width:1250px){.v123-backup-status span{display:none}.v123-backup-status{padding:7px;min-width:32px;justify-content:center}}
@media print{.v123-backup-status{display:none!important}}
